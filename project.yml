name: SidePulse
options:
  bundleIdPrefix: com.unipheas
  deploymentTarget:
    macOS: '14.0'
packages:
  SidePulseCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGN_IDENTITY: "-"
    MACOSX_DEPLOYMENT_TARGET: '14.0'
targets:
  SidePulseApp:
    type: application
    platform: macOS
    sources: [Sources/SidePulse]
    resources: [Artwork/SidePulse.icns]
    postBuildScripts:
      - name: Embed command line companion
        script: cp "$BUILT_PRODUCTS_DIR/sidepulsectl" "$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/sidepulsectl"
        inputFiles: ["$(BUILT_PRODUCTS_DIR)/sidepulsectl"]
        outputFiles: ["$(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/sidepulsectl"]
    dependencies:
      - target: SidePulseCommand
        link: false
      - package: SidePulseCore
        product: PulseCore
    settings:
      base:
        PRODUCT_NAME: SidePulse
        PRODUCT_BUNDLE_IDENTIFIER: com.unipheas.SidePulseSwift.UITestHost
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SidePulse
        INFOPLIST_KEY_CFBundleIconFile: SidePulse
        ENABLE_APP_SANDBOX: NO
  SidePulseCommand:
    type: tool
    platform: macOS
    sources: [Sources/PulseCLI]
    dependencies:
      - package: SidePulseCore
        product: PulseCore
    settings:
      base:
        PRODUCT_NAME: sidepulsectl
  SidePulseUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/UITests]
    dependencies:
      - target: SidePulseApp
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SidePulse:
    build:
      targets:
        SidePulseApp: all
    test:
      gatherCoverageData: true
      targets: [SidePulseUITests]
