name: macOS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare full coverage UI host
        if: matrix.os == 'macos-15'
        run: command -v xcodegen || brew install xcodegen
      - name: Test macOS app, hardware protocols, and CLI
        run: Scripts/test-coverage.sh
        env:
          MIN_COVERAGE: ${{ matrix.os == 'macos-15' && '100' || '80' }}
          RUN_UI_TESTS: ${{ matrix.os == 'macos-15' && '1' || '0' }}
          RUN_INSTALLED_TESTS: ${{ matrix.os == 'macos-15' && '1' || '0' }}
          RUN_CLASSIFIER_TESTS: ${{ matrix.os == 'macos-15' && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SidePulse-coverage-${{ matrix.os }}
          path: .build/coverage-report
      - name: Build and verify universal app
        run: Scripts/package.sh --universal
      - name: Exercise packaged CLI and resources
        run: |
          cli="dist/SidePulse.app/Contents/MacOS/sidepulsectl"
          "$cli" --version
          "$cli" animations | grep -Fx cyan-roll-8
          export SIDEPULSE_SWIFT_HOME="$RUNNER_TEMP/sidepulse-settings"
          printf '%s' '{"hook_event_name":"Stop","session_id":"test"}' | "$cli" hook-log --provider codex
          "$cli" agent-monitor status --json | jq -e '.mode == "completed"'
          "$cli" settings done 0
          "$cli" agent-monitor status --json | jq -e '.mode == "idle_ready"'
          lipo "$cli" -verify_arch arm64 x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: SidePulse-macOS-${{ matrix.os }}
          path: dist/SidePulse-macOS.zip
  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose isolated async classifier boundaries
        if: matrix.sanitizer == 'address'
        run: |
          swift --version
          xcodebuild -version
          failures=0
          for test in testDefaultClassifyReportsUnavailableModel testDefaultResultReportsUnavailableModel testClassifyPropagatesInjectedGeneratorFailure; do
            swift test --sanitize=address --filter "$test" || failures=$((failures + 1))
          done
          test "$failures" = 0
      - name: Check memory safety and concurrent access
        if: always()
        run: swift test --sanitize=${{ matrix.sanitizer }}
  interface:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare UI test host
        run: command -v xcodegen || brew install xcodegen
      - name: Exercise settings, profiles, and live status in the Mac app
        run: Scripts/test-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SidePulse-interface-tests
          path: .build/ui-tests
